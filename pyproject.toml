[project]
name = "apkookies"
version = "0.1.0"
description = "AI-based fraud APK & phishing-URL analysis with explainable risk scoring"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Core = API + static analysis + scoring: androguard supplies the ML inputs and
# backend/scoring imports torch/joblib/numpy unconditionally, so they're required.
# requirements.txt pins the exact verified versions; the extras below are optional
# and their versions have NOT been verified together yet.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "androguard>=4.1.4,<4.2",
    "py-tlsh>=5.0",
    "numpy>=1.26,<2",
    "joblib>=1.4",
    "torch>=2.6,<2.7",
    "xgboost>=2.1,<2.2",
    "scikit-learn>=1.5,<1.6",
    "pandas>=2.2",
]

[project.optional-dependencies]
static = [
    "tldextract>=5.1",   # IOC domain parsing (falls back to a built-in TLD list)
    "python-magic>=0.4.27",  # libmagic file signature detection
    "ssdeep>=3.4",       # optional secondary fuzzy hash (needs libfuzzy); TLSH is core
]
ml = [
    "torch-geometric>=2.5",  # real RGCNConv path (rgcn.py has a CPU fallback)
    "pgmpy>=0.1.25",     # Bayesian network
    "neo4j>=5.19",       # optional knowledge-graph driver (Neo4j is not required)
]
sandbox = [
    "frida==16.7.19",    # 17.x: Java bridge doesn't deploy on the test AVD (verified Aug 2026)
    "frida-tools>=13.0,<14",
    "mitmproxy>=10.2",
]
quark = [
    # GPL-3.0; used only as an optional external dependency (never vendored).
    # Rules: github.com/quark-engine/quark-rules @ 514c21c (docs/QUARK.md).
    "quark-engine==26.10.1",
]
genai = [
    "openai>=1.30",
    "google-genai>=1.0",
    "chromadb>=0.5",     # vector store for RAG grounding
    "stix2>=3.0",        # STIX 2.1 export
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
